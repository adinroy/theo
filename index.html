<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World Clock 🌍</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0f2027;
  --text: white;
}

.light {
  --bg: #f5f5f5;
  --text: #111;
}

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* Header */
header {
  position: sticky;
  top: 0;
  padding: 15px;
  backdrop-filter: blur(10px);
}

.controls {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 25px;
  border: none;
}

/* Grid */
.container {
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 18px;
}

/* Card */
.clock {
  border-radius: 18px;
  padding: 18px;
  transition: 0.3s;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* Day/Night */
.day-bg { background: linear-gradient(135deg, #2193b0, #6dd5ed); }
.night-bg { background: linear-gradient(135deg, #141e30, #243b55); }

.city { font-size: 16px; font-weight: 600; }
.time { font-size: 28px; font-weight: 700; }
.date { font-size: 13px; opacity: 0.85; }
.utc { font-size: 12px; opacity: 0.7; }

/* Top indicator */
.indicator {
  position: absolute;
  right: 15px;
  top: 15px;
  font-size: 18px;
}

/* Bottom bar */
.bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
}

/* Favorite button */
.fav-btn {
  padding: 5px 10px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  font-size: 12px;
}

.fav-on {
  background: gold;
  color: black;
}

.fav-off {
  background: rgba(255,255,255,0.2);
  color: white;
}

/* Pulse */
.pulse {
  width: 8px;
  height: 8px;
  background: lime;
  border-radius: 50%;
  display: inline-block;
  margin-left: 5px;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% { opacity: 0.3; }
  50% { opacity: 1; }
  100% { opacity: 0.3; }
}
</style>
</head>

<body>

<header>
  <h2>🌍 World Clock</h2>
  <div class="controls">
    <input type="text" id="search" placeholder="Search country...">
    <button onclick="toggleTheme()">🌙</button>
  </div>
</header>

<div class="container" id="container"></div>

<script>
const countries = [
  { name: "India 🇮🇳", zone: "Asia/Kolkata" },
  { name: "Japan 🇯🇵", zone: "Asia/Tokyo" },
  { name: "China 🇨🇳", zone: "Asia/Shanghai" },
  { name: "UAE 🇦🇪", zone: "Asia/Dubai" },
  { name: "France 🇫🇷", zone: "Europe/Paris" },
  { name: "UK 🇬🇧", zone: "Europe/London" },
  { name: "USA 🇺🇸", zone: "America/New_York" },
  { name: "Canada 🇨🇦", zone: "America/Toronto" },
  { name: "Australia 🇦🇺", zone: "Australia/Sydney" },
  { name: "New Zealand 🇳🇿", zone: "Pacific/Auckland" }
];

const container = document.getElementById("container");
let favs = JSON.parse(localStorage.getItem("fav")) || [];

/* Render */
function render() {
  container.innerHTML = "";

  const sorted = [...countries].sort((a,b)=>{
    if(favs.includes(a.zone)) return -1;
    if(favs.includes(b.zone)) return 1;
    return 0;
  });

  sorted.forEach(c => {
    const div = document.createElement("div");
    div.className = "clock";
    div.setAttribute("data-name", c.name.toLowerCase());

    div.innerHTML = `
      <div class="indicator" id="icon-${c.zone}"></div>

      <div>
        <div class="city">${c.name}</div>
        <div class="time" id="${c.zone}">--</div>
        <div class="date" id="date-${c.zone}"></div>
        <div class="utc" id="utc-${c.zone}"></div>
      </div>

      <div class="bottom">
        <span id="label-${c.zone}"></span>
        <button class="fav-btn ${favs.includes(c.zone) ? 'fav-on':'fav-off'}"
          onclick="toggleFav('${c.zone}')">
          ${favs.includes(c.zone) ? '★ Saved' : '☆ Save'}
        </button>
      </div>
    `;

    container.appendChild(div);
  });
}

/* Update */
function update() {
  const now = new Date();

  countries.forEach(c => {
    const local = new Date(now.toLocaleString("en-US", { timeZone: c.zone }));
    const hour = local.getHours();
    const isDay = hour >= 6 && hour < 18;

    document.getElementById(c.zone).innerHTML =
      local.toLocaleTimeString() + `<span class="pulse"></span>`;

    document.getElementById("date-" + c.zone).textContent =
      local.toDateString();

    document.getElementById("icon-" + c.zone).textContent =
      isDay ? "☀️" : "🌙";

    const offset = -local.getTimezoneOffset()/60;
    document.getElementById("utc-" + c.zone).textContent =
      "UTC " + (offset>=0?"+":"") + offset;

    const card = document.getElementById(c.zone).closest(".clock");
    card.classList.remove("day-bg","night-bg");
    card.classList.add(isDay ? "day-bg" : "night-bg");
  });
}

/* Fav */
function toggleFav(zone){
  if(favs.includes(zone)){
    favs = favs.filter(z=>z!==zone);
  } else {
    favs.push(zone);
  }
  localStorage.setItem("fav", JSON.stringify(favs));
  render();
}

/* Search */
document.getElementById("search").addEventListener("input", e=>{
  const val = e.target.value.toLowerCase();
  document.querySelectorAll(".clock").forEach(c=>{
    c.style.display = c.dataset.name.includes(val) ? "block":"none";
  });
});

/* Theme */
function toggleTheme(){
  document.body.classList.toggle("light");
}

render();
setInterval(update,1000);
update();
</script>

</body>
</html>
