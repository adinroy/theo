<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World Clock 🌍</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: white;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 30px;
}

/* Title */
h1 {
  font-size: 2.5rem;
  margin-bottom: 20px;
}

/* Search bar */
.search {
  margin-bottom: 20px;
}

.search input {
  padding: 10px 15px;
  border-radius: 25px;
  border: none;
  outline: none;
  width: 250px;
  font-size: 14px;
}

/* Grid */
.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  width: 100%;
  max-width: 1000px;
}

/* Card */
.clock {
  background: rgba(255, 255, 255, 0.08);
  border-radius: 16px;
  padding: 20px;
  backdrop-filter: blur(12px);
  box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  transition: 0.3s;
}

.clock:hover {
  transform: translateY(-5px) scale(1.03);
}

/* City */
.city {
  font-size: 18px;
  font-weight: 500;
  margin-bottom: 8px;
}

/* Time */
.time {
  font-size: 24px;
  font-weight: 700;
}

/* Date */
.date {
  font-size: 13px;
  opacity: 0.7;
}

</style>
</head>

<body>

<h1>🌍 World Clock</h1>

<div class="search">
  <input type="text" id="searchInput" placeholder="Search country or city...">
</div>

<div class="container" id="clockContainer"></div>

<script>
const cities = [
  { name: "India 🇮🇳", zone: "Asia/Kolkata" },
  { name: "New York 🇺🇸", zone: "America/New_York" },
  { name: "London 🇬🇧", zone: "Europe/London" },
  { name: "Tokyo 🇯🇵", zone: "Asia/Tokyo" },
  { name: "Sydney 🇦🇺", zone: "Australia/Sydney" },
  { name: "Dubai 🇦🇪", zone: "Asia/Dubai" },
  { name: "Paris 🇫🇷", zone: "Europe/Paris" },
  { name: "Singapore 🇸🇬", zone: "Asia/Singapore" },
  { name: "Toronto 🇨🇦", zone: "America/Toronto" },
  { name: "Berlin 🇩🇪", zone: "Europe/Berlin" }
];

const container = document.getElementById("clockContainer");

function createClocks() {
  container.innerHTML = "";
  cities.forEach(city => {
    const div = document.createElement("div");
    div.className = "clock";
    div.setAttribute("data-name", city.name.toLowerCase());

    div.innerHTML = `
      <div class="city">${city.name}</div>
      <div class="time" id="${city.zone}">--:--:--</div>
      <div class="date" id="date-${city.zone}"></div>
    `;

    container.appendChild(div);
  });
}

function updateClocks() {
  cities.forEach(city => {
    const now = new Date();

    const time = now.toLocaleTimeString("en-US", {
      timeZone: city.zone,
      hour12: true
    });

    const date = now.toLocaleDateString("en-US", {
      timeZone: city.zone,
      weekday: "short",
      day: "numeric",
      month: "short"
    });

    document.getElementById(city.zone).textContent = time;
    document.getElementById("date-" + city.zone).textContent = date;
  });
}

/* Search filter */
document.getElementById("searchInput").addEventListener("input", function () {
  const value = this.value.toLowerCase();
  const clocks = document.querySelectorAll(".clock");

  clocks.forEach(clock => {
    const name = clock.getAttribute("data-name");
    clock.style.display = name.includes(value) ? "block" : "none";
  });
});

createClocks();
setInterval(updateClocks, 1000);
updateClocks();
</script>

</body>
</html>
